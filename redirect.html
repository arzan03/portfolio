<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Handle GitHub Pages serving the site from a subdirectory
    const segments = window.location.pathname.split('/');
    const baseUrl = segments.slice(0, segments.length - 1).join('/');
    
    // Redirect to the index.html
    window.location.href = baseUrl + '/index.html' + window.location.search + window.location.hash;
  </script>
</head>
<body>
  <p>Redirecting to the main page...</p>
</body>
</html>
